<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ITS Handball 作戦ボード v2.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-select { user-select: none; -webkit-user-select: none; }
    .player-label { font-family: sans-serif; font-weight: bold; pointer-events: none; }
    .modal-backdrop { backdrop-filter: blur(4px); }
    .tool-btn.active { background-color: #e5e7eb; border-color: #9ca3af; box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.1); }
    .animating-piece { transition: transform 1.2s ease-in-out; }
    .animating-line { transition: x1 1.2s ease-in-out, y1 1.2s ease-in-out, x2 1.2s ease-in-out, y2 1.2s ease-in-out; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-bottom: env(safe-area-inset-bottom); }

    @media (orientation: portrait) {
      .responsive-header { flex-wrap: wrap !important; overflow-x: visible !important; white-space: normal !important; }
      .separator { display: none !important; }
    }
    .v2-btn { background:white; border:1px solid #cbd5e1; border-radius:5px; padding:5px 8px; font-weight:600; min-height:32px; }
    .v2-btn:focus-visible, button:focus-visible {outline:2px solid #2563eb;outline-offset:2px}
    #board {touch-action:none}
    @media(max-width:640px){#v2-tools {max-height:100px;overflow-y:auto} .v2-btn{min-height:36px}}
    .compact-header{background:#fff;z-index:20;flex-shrink:0;box-shadow:0 2px 8px #0002;font-family:system-ui,sans-serif}
    .primary-bar,.secondary-bar{display:flex;align-items:center;gap:5px;padding:5px 8px;overflow-x:auto;white-space:nowrap}
    .primary-bar button,.primary-bar select,.secondary-bar select,#tools-panel button,#tools-panel select{font-size:12px;border:1px solid #cbd5e1;border-radius:7px;background:#f8fafc;padding:7px 9px;min-height:34px;cursor:pointer;color:#1e293b}
    .primary-bar .brand{font-size:13px;letter-spacing:.5px;color:#1e293b;margin-right:5px}.brand span{color:#2563eb}
    .primary-bar .active{background:#dbeafe;border-color:#3b82f6}.primary-bar .play-btn{background:#16a34a;color:white;border-color:#16a34a}
    #tools-toggle{margin-left:auto;background:#e0e7ff!important;font-weight:700}
    .secondary-bar{padding-top:0;padding-bottom:4px;justify-content:space-between;font-size:11px;color:#475569}
    .secondary-bar select{padding:3px 5px;min-height:25px}
    #tools-panel{padding:8px;max-height:36vh;overflow-y:auto;border-top:1px solid #ddd;background:#f8fafc}
    #tools-panel[hidden]{display:none!important}#tools-panel section{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}#tools-panel section b{font-size:11px;min-width:85px;color:#475569}
    @media(max-width:640px){
      .brand{display:none}.primary-bar{gap:5px;padding:7px 6px}
      .primary-bar button,.primary-bar select{padding:10px 12px;font-size:13px;min-height:44px;flex-shrink:0}
      .secondary-bar{font-size:12px;padding:3px 8px 6px}
      #tools-panel button,#tools-panel select{min-height:44px;font-size:13px}
      #svg-container{justify-content:flex-start;align-items:center;overscroll-behavior:contain}
      #board{flex:none;max-width:none!important;max-height:none!important}
    }
    .df-edit-hint{background:#dbeafe;color:#1d4ed8;font-weight:700;padding:5px 9px;border-radius:6px}
    .piece-group{touch-action:none}
    #svg-container{touch-action:pan-x pan-y}

  </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col font-sans text-gray-800 touch-none select-none">

  <header class="compact-header">
    <div class="primary-bar">
      <strong class="brand">ITS <span>TACTICS</span></strong>
      <select id="view-select" aria-label="コート"><option value="full-h">フル横</option><option value="full-v">フル縦</option><option value="half">ハーフ</option></select>
      <button id="mode-move" class="tool-btn active">☝ 駒を移動</button>
      <button id="mode-draw-red" class="tool-btn">✎ 赤線</button>
      <button id="mode-draw-blue" class="tool-btn">✎ 青線</button>
      <button id="undo-btn" title="戻す">↶</button><button id="redo-btn" title="やり直す">↷</button>
      <button id="record-scene-btn" title="現在の配置をアニメーションの1コマとして保存">＋ シーン記録 <span id="scene-count">0</span></button>
      <button id="play-anim-btn" class="play-btn">▶ 再生</button>
      <button id="tools-toggle" aria-expanded="false" aria-controls="tools-panel">☰ ツール</button>
    </div>
    <div class="secondary-bar"><label>駒の表示 <select id="piece-style"><option value="person">人形</option><option value="circle">丸駒</option></select></label><span id="status" role="status" aria-live="polite">自動保存 有効</span></div>
    <div id="tools-panel" hidden>
      <section><b>駒・備品</b><button id="add-a-btn">＋赤選手</button><button id="add-b-btn">＋青選手</button><button id="add-df-line-btn">＋DFライン（接続）</button><button id="add-cone-btn">＋コーン</button><button id="add-marker-btn">＋マーカー</button></section>
      <section><b>作戦・描画</b><select id="template-select"><option value="">戦術テンプレート</option><option value="6-0">6-0 DF</option><option value="5-1">5-1 DF</option><option value="3-2-1">3-2-1 DF</option><option value="7attack">7人攻撃</option></select><select id="line-style"><option value="move">移動（実線）</option><option value="pass">パス（破線）</option><option value="shot">シュート（太線）</option></select><button id="clear-lines-btn">線・DFライン消去</button></section>
      <section><b>シーン</b><button id="prev-scene">◀ 前</button><button id="next-scene">次 ▶</button><button id="stop-btn">■ 停止</button><button id="clear-anim-btn">シーン消去</button><label>速度 <select id="speed-select"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></section>
      <section><b>ファイル・画面</b><button id="save-btn">JSON保存</button><button id="load-btn">JSON読込</button><input type="file" id="load-file" accept=".json,application/json" hidden><button id="png-btn">PNG出力</button><button id="fullscreen-btn">全画面</button><button id="reset-btn">初期化</button></section>
    </div>
  </header>

  <main class="flex-grow relative w-full bg-[#2b3e50] overflow-auto flex items-center justify-center" id="svg-container">
    <svg id="board" viewBox="-25 -15 850 430" preserveAspectRatio="xMidYMid meet" class="w-full h-full max-h-full object-contain block transition-all duration-500 touch-none drop-shadow-lg">
      <defs>
        <clipPath id="court-clip-full-h"><rect x="0" y="0" width="800" height="400" /></clipPath>
        <clipPath id="court-clip-full-v"><rect x="0" y="0" width="400" height="800" /></clipPath>
        <clipPath id="court-clip-half"><rect x="0" y="0" width="400" height="400" /></clipPath>

        <pattern id="goalPattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="5" height="10" fill="#ef4444" />
          <rect x="5" width="5" height="10" fill="white" />
        </pattern>

        <linearGradient id="courtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f5b87f" />
          <stop offset="100%" stop-color="#e09e5a" />
        </linearGradient>

        <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fdba74" />
          <stop offset="20%" stop-color="#f97316" />
          <stop offset="80%" stop-color="#ea580c" />
          <stop offset="100%" stop-color="#9a3412" />
        </linearGradient>

        <radialGradient id="markerGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="50%" stop-color="#eab308" />
          <stop offset="100%" stop-color="#a16207" />
        </radialGradient>

        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 2 L 10 5 L 0 8 L 2.5 5 z" fill="#ef4444" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 2 L 10 5 L 0 8 L 2.5 5 z" fill="#3b82f6" />
        </marker>
      </defs>

      <g id="court-full-h">
        <rect x="-100" y="-100" width="1000" height="600" fill="#2b3e50" />
        <rect x="0" y="0" width="800" height="400" fill="url(#courtGrad)" />
        <g clip-path="url(#court-clip-full-h)">
          <line x1="400" y1="0" x2="400" y2="400" stroke="white" stroke-width="3" />
          <circle cx="400" cy="200" r="40" fill="none" stroke="white" stroke-width="2" />
          <path d="M 0 50 A 120 120 0 0 1 120 170 L 120 230 A 120 120 0 0 1 0 350 Z" fill="#4da6ff" stroke="white" stroke-width="2" />
          <path d="M 0 -10 A 180 180 0 0 1 180 170 L 180 230 A 180 180 0 0 1 0 410" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10, 10" />
          <line x1="140" y1="190" x2="140" y2="210" stroke="white" stroke-width="2" />
          <line x1="80" y1="195" x2="80" y2="205" stroke="white" stroke-width="2" />
          <path d="M 800 50 A 120 120 0 0 0 680 170 L 680 230 A 120 120 0 0 0 800 350 Z" fill="#4da6ff" stroke="white" stroke-width="2" />
          <path d="M 800 -10 A 180 180 0 0 0 620 170 L 620 230 A 180 180 0 0 0 800 410" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10, 10" />
          <line x1="660" y1="190" x2="660" y2="210" stroke="white" stroke-width="2" />
          <line x1="720" y1="195" x2="720" y2="205" stroke="white" stroke-width="2" />
        </g>
        <rect x="0" y="0" width="800" height="400" fill="none" stroke="white" stroke-width="3" />
        <line x1="310" y1="-5" x2="310" y2="5" stroke="white" stroke-width="3" />
        <line x1="490" y1="-5" x2="490" y2="5" stroke="white" stroke-width="3" />
        <rect x="-20" y="170" width="20" height="60" fill="url(#goalPattern)" stroke="white" stroke-width="2" />
        <rect x="800" y="170" width="20" height="60" fill="url(#goalPattern)" stroke="white" stroke-width="2" />
      </g>

      <g id="court-full-v" style="display: none;">
        <rect x="-100" y="-100" width="600" height="1000" fill="#2b3e50" />
        <rect x="0" y="0" width="400" height="800" fill="url(#courtGrad)" />
        <g clip-path="url(#court-clip-full-v)">
          <line x1="0" y1="400" x2="400" y2="400" stroke="white" stroke-width="3" />
          <circle cx="200" cy="400" r="40" fill="none" stroke="white" stroke-width="2" />
          <path d="M 50 0 A 120 120 0 0 0 170 120 L 230 120 A 120 120 0 0 0 350 0 Z" fill="#4da6ff" stroke="white" stroke-width="2" />
          <path d="M -10 0 A 180 180 0 0 0 170 180 L 230 180 A 180 180 0 0 0 410 0" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10, 10" />
          <line x1="190" y1="140" x2="210" y2="140" stroke="white" stroke-width="2" />
          <line x1="185" y1="80" x2="215" y2="80" stroke="white" stroke-width="2" />
          <path d="M 50 800 A 120 120 0 0 1 170 680 L 230 680 A 120 120 0 0 1 350 800 Z" fill="#4da6ff" stroke="white" stroke-width="2" />
          <path d="M -10 800 A 180 180 0 0 1 170 620 L 230 620 A 180 180 0 0 1 410 800" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10, 10" />
          <line x1="190" y1="660" x2="210" y2="660" stroke="white" stroke-width="2" />
          <line x1="185" y1="720" x2="215" y2="720" stroke="white" stroke-width="2" />
        </g>
        <rect x="0" y="0" width="400" height="800" fill="none" stroke="white" stroke-width="3" />
        <line x1="-5" y1="310" x2="5" y2="310" stroke="white" stroke-width="3" />
        <line x1="-5" y1="490" x2="5" y2="490" stroke="white" stroke-width="3" />
        <line x1="395" y1="310" x2="405" y2="310" stroke="white" stroke-width="3" />
        <line x1="395" y1="490" x2="405" y2="490" stroke="white" stroke-width="3" />
        <rect x="170" y="-20" width="60" height="20" fill="url(#goalPattern)" stroke="white" stroke-width="2" />
        <rect x="170" y="800" width="60" height="20" fill="url(#goalPattern)" stroke="white" stroke-width="2" />
      </g>

      <g id="court-half" style="display: none;">
        <rect x="-100" y="-100" width="600" height="600" fill="#2b3e50" />
        <rect x="0" y="0" width="400" height="400" fill="url(#courtGrad)" />
        <g clip-path="url(#court-clip-half)">
          <line x1="0" y1="400" x2="400" y2="400" stroke="white" stroke-width="3" />
          <path d="M 50 0 A 120 120 0 0 0 170 120 L 230 120 A 120 120 0 0 0 350 0 Z" fill="#4da6ff" stroke="white" stroke-width="2" />
          <path d="M -10 0 A 180 180 0 0 0 170 180 L 230 180 A 180 180 0 0 0 410 0" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10, 10" />
          <line x1="190" y1="140" x2="210" y2="140" stroke="white" stroke-width="2" />
          <line x1="185" y1="80" x2="215" y2="80" stroke="white" stroke-width="2" />
        </g>
        <rect x="0" y="0" width="400" height="400" fill="none" stroke="white" stroke-width="3" />
        <line x1="-5" y1="310" x2="5" y2="310" stroke="white" stroke-width="3" />
        <line x1="395" y1="310" x2="405" y2="310" stroke="white" stroke-width="3" />
        <rect x="170" y="-20" width="60" height="20" fill="url(#goalPattern)" stroke="white" stroke-width="2" />
      </g>

      <g id="df-lines-layer"></g>
      <g id="draw-layer"></g>
      <g id="players-layer"></g>
    </svg>
  </main>

  <div id="name-modal" class="fixed inset-0 bg-black bg-opacity-50 modal-backdrop hidden flex justify-center items-center z-50">
    <div class="bg-white rounded-xl shadow-xl p-4 w-64 max-w-[90%] transform transition-all">
      <h3 class="text-sm font-bold text-gray-800 mb-3 text-center border-b pb-2">駒の名前を変更</h3>
      <input type="text" id="name-input" class="w-full border border-gray-300 rounded p-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center text-lg font-bold" autocomplete="off" maxlength="8" placeholder="背番号など">
      <div class="flex justify-between gap-2">
        <button id="modal-cancel" class="flex-1 py-1.5 bg-gray-200 text-gray-700 rounded text-sm font-bold">キャンセル</button>
        <button id="modal-save" class="flex-1 py-1.5 bg-blue-600 text-white rounded text-sm font-bold shadow">保存</button>
      </div>
    </div>
  </div>

  <script>
(() => {
'use strict';
const $=id=>document.getElementById(id), svg=$('board'), layer=$('players-layer'), draw=$('draw-layer'), df=$('df-lines-layer');
const NS='http://www.w3.org/2000/svg', KEY='its_handball_board_v2';
const clone=o=>JSON.parse(JSON.stringify(o));
const base={
 'full-h':[{team:'A',label:'GK',x:20,y:200},{team:'A',label:'LW',x:130,y:60},{team:'A',label:'LB',x:150,y:120},{team:'A',label:'CB',x:150,y:200},{team:'A',label:'RB',x:150,y:280},{team:'A',label:'RW',x:130,y:340},{team:'A',label:'PV',x:130,y:160},{team:'B',label:'GK',x:780,y:200},{team:'B',label:'RW',x:670,y:40},{team:'B',label:'RB',x:650,y:100},{team:'B',label:'CB',x:650,y:200},{team:'B',label:'LB',x:650,y:300},{team:'B',label:'LW',x:670,y:360},{team:'B',label:'PV',x:670,y:240},{team:'ball',label:'●',x:400,y:200}],
 'full-v':[{team:'A',label:'GK',x:200,y:780},{team:'A',label:'LW',x:60,y:670},{team:'A',label:'LB',x:120,y:650},{team:'A',label:'CB',x:200,y:650},{team:'A',label:'RB',x:280,y:650},{team:'A',label:'RW',x:340,y:670},{team:'A',label:'PV',x:200,y:670},{team:'B',label:'GK',x:200,y:20},{team:'B',label:'RW',x:40,y:130},{team:'B',label:'RB',x:100,y:150},{team:'B',label:'CB',x:200,y:150},{team:'B',label:'LB',x:300,y:150},{team:'B',label:'LW',x:360,y:130},{team:'B',label:'PV',x:200,y:130},{team:'ball',label:'●',x:200,y:400}],
 'half':[{team:'A',label:'GK',x:200,y:20},{team:'A',label:'LW',x:70,y:110},{team:'A',label:'LB',x:130,y:130},{team:'A',label:'CB',x:200,y:140},{team:'A',label:'RB',x:270,y:130},{team:'A',label:'RW',x:330,y:110},{team:'A',label:'PV',x:200,y:110},{team:'B',label:'GK',x:200,y:380},{team:'B',label:'LW',x:40,y:300},{team:'B',label:'LB',x:120,y:250},{team:'B',label:'CB',x:200,y:270},{team:'B',label:'RB',x:280,y:250},{team:'B',label:'RW',x:360,y:300},{team:'B',label:'PV',x:200,y:160},{team:'ball',label:'●',x:200,y:240}]
};
const defaults=view=>base[view].map((p,i)=>({...p,id:p.team==='ball'?'ball':p.team.toLowerCase()+(i+1)}));
let state={view:'full-h',players:defaults('full-h'),paths:[],scenes:[],nextId:100},mode='move',dfAutoEdit=false,history=[],future=[],active=null,playing=false,playToken=0,sceneIndex=-1,editingId=null,dirty=false;
function status(t){$('status').textContent=t}
function snapshot(){return clone(state)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));status('自動保存済み')}catch(e){status('保存不可：JSON出力を使用してください')}}
function checkpoint(){history.push(snapshot());if(history.length>80)history.shift();future=[]}
function commit(){dirty=true;persist();render()}
function apply(s){dfAutoEdit=false;state=clone(s);sceneIndex=-1;persist();render()}
function undo(){if(!history.length||playing)return;future.push(snapshot());apply(history.pop())}
function redo(){if(!future.length||playing)return;history.push(snapshot());apply(future.pop())}
function valid(s){return s&&['full-h','full-v','half'].includes(s.view)&&Array.isArray(s.players)&&s.players.length<=500&&s.players.every(p=>typeof p.id==='string'&&typeof p.team==='string'&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&typeof p.label==='string')&&Array.isArray(s.paths)&&s.paths.length<=2000&&s.paths.every(p=>typeof p.d==='string'&&p.d.length<100000&&['red','blue'].includes(p.color))&&Array.isArray(s.scenes)&&s.scenes.length<=200&&s.scenes.every(c=>Array.isArray(c.players)&&Array.isArray(c.paths))&&Number.isInteger(s.nextId)}
function view(){const v=state.view;$('view-select').value=v;['full-h','full-v','half'].forEach(k=>{$('court-'+k).style.display=k===v?'block':'none'});svg.setAttribute('viewBox',v==='full-h'?'-25 -15 850 430':v==='full-v'?'-15 -25 430 850':'-15 -25 430 440');const mobile=window.innerWidth<=640;svg.style.width=mobile?(v==='full-h'?'850px':v==='full-v'?'min(100%, 430px)':'min(100%, 480px)'):'100%';svg.style.height=mobile?(v==='full-h'?'430px':v==='full-v'?'min(100%, 780px)':'min(100%, 480px)'):'100%'}
function el(tag,attrs={},parent){let n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(parent)parent.appendChild(n);return n}
function render(){view();layer.replaceChildren();df.replaceChildren();draw.replaceChildren();for(const p of state.paths){el('path',{d:p.d,fill:'none',stroke:p.color==='red'?'#ef4444':'#3b82f6','stroke-width':p.style==='shot'?6:4,'stroke-dasharray':p.style==='pass'?'9 7':'', 'stroke-linecap':'round','stroke-linejoin':'round','marker-end':`url(#arrow-${p.color})`,opacity:'.85'},draw)}
 const groups={};for(const p of state.players.filter(p=>p.team==='df-node'))(groups[p.groupId]??=[]).push(p);for(const nodes of Object.values(groups)){if(nodes.length===2)el('line',{x1:nodes[0].x,y1:nodes[0].y,x2:nodes[1].x,y2:nodes[1].y,stroke:'#3b82f6','stroke-opacity':'.4','stroke-width':14,'stroke-linecap':'round','pointer-events':'none'},df)}
 for(const p of [...state.players.filter(p=>p.team==='df-node'),...state.players.filter(p=>p.team!=='df-node')]){const g=el('g',{'data-id':p.id,transform:`translate(${p.x} ${p.y})`,class:'piece-group',style:p.team==='df-node'?(dfAutoEdit&&!p.bindTo?'cursor:grab':'pointer-events:none;opacity:.7'):'cursor:grab'},layer);if(p.team==='df-node'){el('circle',{r:dfAutoEdit&&!p.bindTo?25:15,fill:'transparent'},g);if(!p.bindTo)el('circle',{r:7,fill:'#3b82f6',stroke:'white','stroke-width':2},g)}else if(p.team==='cone'){el('path',{d:'M -10 10 L 0 -13 L 10 10 Z',fill:'#f97316',stroke:'white'},g)}else if(p.team==='marker'){el('circle',{r:12,fill:'#eab308',stroke:'white'},g)}else{el('circle',{r:25,fill:'transparent','pointer-events':'all'},g);const ball=p.team==='ball',person=!ball&&$('piece-style').value==='person',fill=ball?'#facc15':p.team==='A'?'#ef4444':'#3b82f6';if(person){el('circle',{cx:0,cy:-13,r:7,fill,stroke:'white','stroke-width':1.6},g);el('path',{d:'M -9 -3 Q 0 -7 9 -3 L 12 11 L 6 12 L 4 6 L 4 19 L -3 19 L -4 6 L -6 12 L -12 11 Z',fill,stroke:'white','stroke-width':1.4,'stroke-linejoin':'round'},g);el('rect',{x:-13,y:-27,width:26,height:10,rx:3,fill:'#111827',opacity:'.85'},g)}else{el('circle',{r:ball?11:16,fill,stroke:'white','stroke-width':2},g)}const t=el('text',{x:0,y:person?-19:4,'text-anchor':'middle',fill:person?'white':ball?'#111':'white','font-size':p.label.length>3?8:person?8:12,'font-weight':'bold','pointer-events':'none'},g);t.textContent=p.label} }
 $('scene-count').textContent=state.scenes.length;$('undo-btn').disabled=!history.length;$('redo-btn').disabled=!future.length;
}
function pos(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return{x:0,y:0};const q=pt.matrixTransform(m.inverse());return{x:q.x,y:q.y}}
function bounds(p){const [w,h]=state.view==='full-h'?[800,400]:state.view==='full-v'?[400,800]:[400,400];return{x:Math.max(-22,Math.min(w+22,p.x)),y:Math.max(-22,Math.min(h+22,p.y))}}
function setMode(m){mode=m;['move','draw-red','draw-blue'].forEach(x=>$('mode-'+x).classList.toggle('active',x===m));svg.style.cursor=m==='move'?'default':'crosshair';status(m==='move'?(dfAutoEdit?'DFライン接続中：青い端点を選手に重ねてください':'駒の移動モード'):'描画モード：線を描けます')}
svg.addEventListener('pointerdown',e=>{if(playing||e.button!==0)return;const target=e.target.closest?.('.piece-group');const p=target&&state.players.find(x=>x.id===target.dataset.id);if(mode==='move'&&(!p||(p.team==='df-node'&&(!dfAutoEdit||!!p.bindTo))))return;checkpoint();const at=pos(e);active={id:e.pointerId,start:at,moved:false,player:mode==='move'?p:null,offset:p?{x:at.x-p.x,y:at.y-p.y}:null,points:mode==='move'?null:[at]};svg.setPointerCapture(e.pointerId);e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!active||active.id!==e.pointerId)return;const at=pos(e);if(Math.hypot(at.x-active.start.x,at.y-active.start.y)>3)active.moved=true;if(active.player){const p=active.player,q=bounds({x:at.x-active.offset.x,y:at.y-active.offset.y});p.x=q.x;p.y=q.y;if(p.team==='df-node'){const near=state.players.filter(x=>['A','B'].includes(x.team)).map(x=>({p:x,d:Math.hypot(x.x-p.x,x.y-p.y)})).sort((a,b)=>a.d-b.d)[0];if(near&&near.d<48){p.x=near.p.x;p.y=near.p.y;p.bindTo=near.p.id}else p.bindTo=null}else state.players.filter(n=>n.team==='df-node'&&n.bindTo===p.id).forEach(n=>{n.x=p.x;n.y=p.y});render()}else{active.points.push(at);const color=mode==='draw-red'?'red':'blue';const d=active.points.map((q,i)=>`${i?'L':'M'} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' ');const prev=draw.querySelector('[data-preview]');if(prev)prev.remove();el('path',{'data-preview':'1',d,fill:'none',stroke:color==='red'?'#ef4444':'#3b82f6','stroke-width':4,'stroke-linecap':'round'},draw)}e.preventDefault()});
function endPointer(e,cancel=false){if(!active||active.id!==e.pointerId)return;const a=active;active=null;try{svg.releasePointerCapture(e.pointerId)}catch{}if(cancel){apply(history.pop());return}if(a.player){if(!a.moved&&a.player.team!=='ball'&&!['cone','marker','df-node'].includes(a.player.team)){history.pop();openModal(a.player.id);return}if(a.player.team==='df-node'){const nearest=state.players.filter(p=>['A','B'].includes(p.team)).map(p=>({p,d:Math.hypot(p.x-a.player.x,p.y-a.player.y)})).sort((a,b)=>a.d-b.d)[0];if(nearest&&nearest.d<48){a.player.bindTo=nearest.p.id;a.player.x=nearest.p.x;a.player.y=nearest.p.y}if(state.players.filter(n=>n.team==='df-node').every(n=>!!n.bindTo)){dfAutoEdit=false;status('DFライン接続完了。端点は選手の背後に固定されました')}}}else if(a.points.length>1){state.paths.push({d:a.points.map((q,i)=>`${i?'L':'M'} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' '),color:mode==='draw-red'?'red':'blue',style:$('line-style').value})}else{history.pop();render();return}commit()}
svg.addEventListener('pointerup',e=>endPointer(e));svg.addEventListener('pointercancel',e=>endPointer(e,true));
function add(team){if(playing)return;checkpoint();const [x,y]=state.view==='full-h'?[400,200]:state.view==='full-v'?[200,400]:[200,200];const id=state.nextId++;if(team==='df-node'){dfAutoEdit=true;setMode('move');$('tools-panel').hidden=true;$('tools-toggle').setAttribute('aria-expanded','false');const groupId='df_'+id;state.players.push({id:groupId+'_1',team,groupId,label:'',x:x-50,y},{id:groupId+'_2',team,groupId,label:'',x:x+50,y})}else state.players.push({id:'new_'+id,team,label:team==='A'||team==='B'?'+':'',x,y});commit()}
function openModal(id){editingId=id;const p=state.players.find(x=>x.id===id);$('name-input').value=p?.label||'';$('name-modal').classList.remove('hidden');$('name-input').focus()}
function closeModal(){$('name-modal').classList.add('hidden');editingId=null}
function saveName(){if(editingId){checkpoint();const p=state.players.find(x=>x.id===editingId);if(p)p.label=$('name-input').value.trim().slice(0,8)||' ';commit()}closeModal()}
function stop(){playToken++;playing=false;$('play-anim-btn').textContent='▶ 再生';status('再生停止')}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){if(playing)return;if(state.scenes.length<2){alert('2シーン以上記録してください');return}playing=true;const token=++playToken,original=snapshot(),scenes=clone(state.scenes),speed=Number($('speed-select').value);$('play-anim-btn').textContent='再生中…';for(let i=0;i<scenes.length&&token===playToken;i++){const target=scenes[i];if(i===0){state.players=clone(target.players);state.paths=clone(target.paths);render();await sleep(250/speed);continue}const start=clone(state.players),duration=1200/speed,t0=performance.now();while(token===playToken){const t=Math.min(1,(performance.now()-t0)/duration),ease=t*t*(3-2*t);state.players=target.players.map(p=>{const a=start.find(x=>x.id===p.id);return a?{...p,x:a.x+(p.x-a.x)*ease,y:a.y+(p.y-a.y)*ease}:clone(p)});state.paths=clone(target.paths);render();if(t>=1)break;await new Promise(requestAnimationFrame)}sceneIndex=i}if(token===playToken){state.players=clone(original.players);state.paths=clone(original.paths);playing=false;$('play-anim-btn').textContent='▶ 再生';render();status('再生終了（元の配置に復元）')}else{state.players=clone(original.players);state.paths=clone(original.paths);render()}}
function selectScene(delta){if(playing||!state.scenes.length)return;sceneIndex=(sceneIndex+delta+state.scenes.length)%state.scenes.length;checkpoint();state.players=clone(state.scenes[sceneIndex].players);state.paths=clone(state.scenes[sceneIndex].paths);commit();status(`シーン ${sceneIndex+1}/${state.scenes.length}`)}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){download(new Blob([JSON.stringify({format:'ITS-HB-V2',...state},null,2)],{type:'application/json'}),'handball-tactics-v2.json')}
function exportPNG(){const copy=svg.cloneNode(true);copy.setAttribute('xmlns',NS);copy.setAttribute('width',state.view==='full-h'?1200:800);copy.setAttribute('height',state.view==='full-v'?1600:state.view==='full-h'?645:880);const xml=new XMLSerializer().serializeToString(copy);const img=new Image(),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);c.toBlob(b=>{if(b)download(b,'handball-tactics-v2.png');else alert('PNG出力に失敗しました')},'image/png');URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像変換に失敗しました')};img.src=url}
function template(kind){if(!kind||playing)return;checkpoint();const v=state.view,w=v==='full-h'?800:400,h=v==='full-v'?800:400;const defenders=state.players.filter(p=>p.team==='B'&&p.label!=='GK');const positions=kind==='6-0'?[[-.34,.22],[-.2,.27],[-.07,.29],[.07,.29],[.2,.27],[.34,.22]]:kind==='5-1'?[[-.34,.22],[-.17,.27],[0,.29],[.17,.27],[.34,.22],[0,.47]]:[[-.32,.2],[0,.25],[.32,.2],[-.18,.44],[.18,.44],[0,.60]];if(kind==='7attack'){const g=state.players.find(p=>p.team==='A'&&p.label==='GK');if(g){g.label='7th';g.x=w*.5;g.y=h*.55}}else defenders.forEach((p,i)=>{const [dx,dy]=positions[i%positions.length];if(v==='full-h'){p.x=w*.76+dx*140;p.y=h*.5+dy*200-50}else{p.x=w*.5+dx*280;p.y=h*.23+dy*180}});commit();$('template-select').value=''}
function bind(id,fn){$(id).addEventListener('click',fn)}
bind('tools-toggle',()=>{const panel=$('tools-panel');panel.hidden=!panel.hidden;$('tools-toggle').setAttribute('aria-expanded',String(!panel.hidden))});$('piece-style').addEventListener('change',()=>{try{localStorage.setItem('its_hb_piece_style',$('piece-style').value)}catch{}render()});try{$('piece-style').value=localStorage.getItem('its_hb_piece_style')||'person'}catch{};bind('undo-btn',undo);bind('redo-btn',redo);bind('mode-move',()=>setMode('move'));bind('mode-draw-red',()=>setMode('draw-red'));bind('mode-draw-blue',()=>setMode('draw-blue'));
for(const [id,t] of [['add-a-btn','A'],['add-b-btn','B'],['add-cone-btn','cone'],['add-marker-btn','marker'],['add-df-line-btn','df-node']])bind(id,()=>add(t));
bind('clear-lines-btn',()=>{if(playing)return;checkpoint();state.paths=[];state.players=state.players.filter(p=>p.team!=='df-node');dfAutoEdit=false;commit()});
bind('reset-btn',()=>{if(playing)return;if(!confirm('現在の配置・描画・シーンを初期化しますか？（自動保存も更新されます）'))return;checkpoint();state.players=defaults(state.view);dfAutoEdit=false;state.paths=[];state.scenes=[];commit()});
$('view-select').addEventListener('change',e=>{const next=e.target.value;if(playing){e.target.value=state.view;return}if(!confirm('コートを切り替えると現在の配置・描画・シーンが初期化されます。続けますか？')){e.target.value=state.view;return}checkpoint();state.view=next;state.players=defaults(next);dfAutoEdit=false;state.paths=[];state.scenes=[];commit()});
$('template-select').addEventListener('change',e=>template(e.target.value));
bind('record-scene-btn',()=>{if(playing)return;checkpoint();state.scenes.push({players:clone(state.players),paths:clone(state.paths)});commit();status(`シーン ${state.scenes.length} 記録済み`)});
bind('clear-anim-btn',()=>{if(playing)return;if(!confirm('すべてのシーンを削除しますか？'))return;checkpoint();state.scenes=[];commit()});
bind('play-anim-btn',play);bind('stop-btn',stop);bind('prev-scene',()=>selectScene(-1));bind('next-scene',()=>selectScene(1));
bind('modal-cancel',closeModal);bind('modal-save',saveName);$('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();if(e.key==='Escape')closeModal()});
bind('save-btn',exportJSON);bind('load-btn',()=>$('load-file').click());$('load-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!valid(obj))throw Error('データ形式が不正です');if(!confirm('現在の作戦を読み込んだデータで置き換えますか？'))return;stop();checkpoint();apply({view:obj.view,players:obj.players,paths:obj.paths,scenes:obj.scenes,nextId:obj.nextId});status('JSONを読み込みました')}catch(err){alert('読込エラー: '+err.message)}finally{e.target.value=''}});
bind('png-btn',exportPNG);bind('fullscreen-btn',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
window.addEventListener('resize',()=>view());window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state={view:saved.view,players:saved.players,paths:saved.paths,scenes:saved.scenes,nextId:saved.nextId}}catch(e){status('保存データの読込に失敗')}
setMode('move');render();window.__boardV2={getState:()=>clone(state),undo,redo,add,record:()=>$('record-scene-btn').click(),reset:()=>$('reset-btn').click()};
